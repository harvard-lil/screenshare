[project]
name = "screenshare"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
    "channels>=4.1.0,<5",
    "channels-redis>=4.2.0,<5",
    "django-extensions>=3.2.3,<5",
    "django-environ>=0.11.2,<1",
    "requests",
    "urllib3>=2.2.3,<3",
    "django-redis>=5.4.0,<7",
    "slack-sdk>=3.44.1,<4",
    "whitenoise>=6.2.0,<7",
    "twisted>=24.7.0",
    "ipython>=8.11.0",
    "daphne>=4.1.2,<5",
    "pytz>=2024.2",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1,<8",
]

[tool.uv]
package = false
